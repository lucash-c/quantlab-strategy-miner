[project]
name = "quantlab-cli"
version = "0.1.0"
description = "Command-line entry point for QuantLab Strategy Miner"
requires-python = ">=3.12,<3.13"
dependencies = [
  "quantlab-backtest",
  "quantlab-core",
  "quantlab-data",
  "quantlab-mining",
  "quantlab-research",
  "quantlab-robustness",
  "quantlab-scoring",
]

[project.scripts]
quantlab-miner = "quantlab_cli.main:main"

[tool.uv.sources]
quantlab-backtest = { workspace = true }
quantlab-core = { workspace = true }
quantlab-data = { workspace = true }
quantlab-mining = { workspace = true }
quantlab-research = { workspace = true }
quantlab-robustness = { workspace = true }
quantlab-scoring = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantlab_cli"]
