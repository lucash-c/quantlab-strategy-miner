[project]
name = "quantlab-mining"
version = "0.1.0"
description = "Controlled deterministic candidate generation and evaluation"
requires-python = ">=3.12,<3.13"
dependencies = ["quantlab-core", "quantlab-data", "quantlab-backtest"]

[tool.uv.sources]
quantlab-core = { workspace = true }
quantlab-data = { workspace = true }
quantlab-backtest = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantlab_mining"]
