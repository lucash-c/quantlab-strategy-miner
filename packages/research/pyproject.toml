[project]
name = "quantlab-research"
version = "0.1.0"
description = "Frozen chronological discovery and validation experiments"
requires-python = ">=3.12,<3.13"
dependencies = ["quantlab-core", "quantlab-data", "quantlab-backtest", "quantlab-mining"]

[tool.uv.sources]
quantlab-core = { workspace = true }
quantlab-data = { workspace = true }
quantlab-backtest = { workspace = true }
quantlab-mining = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantlab_research"]
