[project]
name = "quantlab-core"
version = "0.1.0"
description = "Deterministic shared quantitative core for QuantLab"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.10,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantlab_core"]

