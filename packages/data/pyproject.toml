[project]
name = "quantlab-data"
version = "0.1.0"
description = "Canonical market-data ingestion and materialization"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pyarrow>=18,<24",
  "quantlab-core",
]

[tool.uv.sources]
quantlab-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantlab_data"]

