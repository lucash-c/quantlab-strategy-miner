[project]
name = "quantlab-scoring"
version = "0.1.0"
description = "Deterministic research strategy scoring, ranking and diversity"
requires-python = ">=3.12,<3.13"
dependencies = ["quantlab-core", "quantlab-data", "quantlab-mining"]

[tool.uv.sources]
quantlab-core = { workspace = true }
quantlab-data = { workspace = true }
quantlab-mining = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantlab_scoring"]
