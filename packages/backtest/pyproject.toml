[project]
name = "quantlab-backtest"
version = "0.1.0"
description = "Chronological deterministic backtesting for QuantLab"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pyarrow>=18,<24",
  "quantlab-core",
  "quantlab-data",
]

[tool.uv.sources]
quantlab-core = { workspace = true }
quantlab-data = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantlab_backtest"]

