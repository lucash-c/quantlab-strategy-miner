[project]
name = "quantlab-strategy-miner-workspace"
version = "0.1.0"
description = "Development workspace for QuantLab Scalp Strategy Miner"
requires-python = ">=3.12,<3.13"
dependencies = [
  "quantlab-backtest",
  "quantlab-cli",
  "quantlab-core",
  "quantlab-data",
  "quantlab-mining",
]

[dependency-groups]
dev = ["ruff>=0.11,<1"]

[tool.uv.sources]
quantlab-backtest = { workspace = true }
quantlab-cli = { workspace = true }
quantlab-core = { workspace = true }
quantlab-data = { workspace = true }
quantlab-mining = { workspace = true }

[tool.uv.workspace]
members = ["apps/cli", "packages/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
